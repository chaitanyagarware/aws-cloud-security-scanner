name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-security-and-demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src || true
      - name: Tests with coverage
        run: pytest --cov=cloudsec_aws_lab --cov-report=term-missing --cov-fail-under=85
      - name: Bandit security scan
        run: bandit -r src -q
      - name: pip-audit dependency scan
        run: pip-audit || true
      - name: Checkov Terraform scan
        run: pip install checkov && checkov -d terraform --quiet || true
      - name: tfsec Terraform scan
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true
        with:
          working_directory: terraform
      - name: Demo analysis
        run: scripts/run_demo.sh
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/demo_report.sarif.json
