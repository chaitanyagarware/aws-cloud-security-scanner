name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check project structure
        run: |
          test -f README.md
          test -f pyproject.toml
          test -d src
          test -d tests
          test -d samples
          test -d docs

      - name: Compile Python source
        run: |
          python -m compileall src

      - name: Verify sample data exists
        run: |
          find samples -type f | head -20
