[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cloud-security-scanner"
version = "0.1.0"
description = "AWS cloud security scanner for IAM, CloudTrail, GuardDuty, Access Analyzer, MITRE ATT&CK, SARIF, ASFF, OCSF, and least privilege analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Chaitanya Garware"}]
dependencies = [
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.5.0", "mypy>=1.8.0", "coverage>=7.0.0", "bandit>=1.7.9", "pip-audit>=2.7.0", "pre-commit>=3.7.0"]
aws = ["boto3>=1.34.0"]
dashboard = ["streamlit>=1.36.0", "pandas>=2.2.0"]

[project.scripts]
aws-cloud-security-scanner = "cloudsec_aws_lab.cli:main"
cloudsec-aws-lab = "cloudsec_aws_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
omit = ["dashboard/*", "lambda/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
